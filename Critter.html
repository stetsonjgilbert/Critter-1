<!DOCTYPE html>

<head>

    <meta charset="UTF-8">

    <title>Critter</title>

<body>

    <!-- Lets start with a couple of geograpic dividers, divs -->

    <div class="wrapper">

        <h1>Smiley Critter</h1>



        <div class="face">

            <div class="lefteye">

                <div class="innerleft"></div>

            </div>

            <div class="rightteye">

                <div class="innerright"></div>

            </div>

            <div class="righteyebrow"></div>

            <div class="lefteyebrow"></div>

            <div class="nose"></div>

            <div class="mouth"></div>



        </div>

    </div>

</body>


   <style>


        .face {

            width: 75px;

            height: 75px;

            border: solid 2px black;

            background-color: yellow;

            border-radius: 50px;

            position: absolute;

        }

       .righteyebrow {

            width: 15px;

            height: 3px;

            border: solid 1px brown;

            border-radius: 3px;

            z-index: 1;

            position: absolute;

            left: 27px;

            top: 20px;

            background-color: brown;

       }

        .lefteye {

            width: 6px;

            height: 6px;

            border: solid 1px black;

            border-radius: 3px;

            z-index: 1;

            position: absolute;

            left: 32px;

            top: 26px;

            background-color: black;

        }



        .innereye {

            width: 2px;

            height: 2px;

            border: solid 1px white;

            border-radius: 2px;

            position: absolute;

            left: 2px;

            top: 2px;

            background-color: white;

        }

       .lefteyebrow {

            width: 15px;

            height: 3px;

            border: solid 1px brown;

            border-radius: 3px;

            z-index: 1;

            position: absolute;

            left: 50px;

            top: 12px;

            background-color: brown;
       }

        .rightteye {

            width: 6px;

            height: 6px;

            border: solid 1px black;

            border-radius: 3px;

            z-index: 1;

            position: absolute;

            left: 54px;

            top: 18px;

            background-color: black;

        }

      .nose {

            width: 25px;

            height: 25px;

            border: solid 2px black;

            background-color: yellow;

            border-radius: 50px;

            left: 60px;

            top: 25px;

            position: absolute;

        }


         .mouth {

            width: 30px;

            height: 10px;

            border: solid 1px black;

            border-radius: 0 0 45px 45px;

            margin: 16px;

            position: absolute;

            top: 2em;

            left: 0.7em;

            background-color: red;

        }

    </style>

</head>

</html>
